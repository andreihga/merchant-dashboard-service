spring:
  application:
    name: merchant-dashboard-service
  autoconfigure:
    exclude:
      # No generated user, so startup does not log a password. Actuator still permits health.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: 1.0
