openapi: 3.1.0
info:
  title: Merchant Dashboard API
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /api/v1/auth/token:
    post:
      operationId: issueToken
      tags:
        - auth
      summary: Issue an HMAC JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: HMAC JWT for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Unknown user or wrong password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/merchants:
    get:
      operationId: listMerchants
      tags:
        - merchants
      summary: List the merchants the caller can access
      responses:
        "200":
          description: Merchants linked to the caller, ordered by name then id. Empty when none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Merchant"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/merchants/{merchantId}/kpis/revenue:
    get:
      operationId: getRevenueKpi
      tags:
        - revenue-kpi
      summary: Revenue for a period and the previous equivalent period
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - $ref: "#/components/parameters/PeriodQuery"
      responses:
        "200":
          description: Revenue of PENDING and APPROVED sales, with the change against the previous window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueKpi"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/merchants/{merchantId}/kpis/transactions:
    get:
      operationId: getTransactionsKpi
      tags:
        - transactions-kpi
      summary: Transaction count for a period and the previous equivalent period
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - $ref: "#/components/parameters/PeriodQuery"
      responses:
        "200":
          description: Count of PENDING and APPROVED sales, with the change against the previous window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountKpi"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/merchants/{merchantId}/kpis/clicks:
    get:
      operationId: getClicksKpi
      tags:
        - clicks-kpi
      summary: Click count for a period and the previous equivalent period
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - $ref: "#/components/parameters/PeriodQuery"
      responses:
        "200":
          description: Sum of daily clicks, with the change against the previous window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountKpi"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/merchants/{merchantId}/revenue-trend:
    get:
      operationId: getRevenueTrend
      tags:
        - revenue-trend
      summary: Daily revenue for a period and the previous equivalent period
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - $ref: "#/components/parameters/PeriodQuery"
      responses:
        "200":
          description: Daily PENDING and APPROVED revenue, zero-filled, with the change against the previous window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueTrend"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MerchantId:
      name: merchantId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PeriodQuery:
      name: period
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Period"
  responses:
    Problem:
      description: RFC 7807 problem detail
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
    Period:
      type: string
      enum:
        - LAST_7_DAYS
        - LAST_30_DAYS
        - LAST_90_DAYS
        - LAST_MONTH
        - THIS_MONTH
    KpiMetric:
      type: string
      enum:
        - REVENUE
        - TRANSACTIONS
        - CLICKS
    RevenueKpi:
      type: object
      required:
        - metric
        - period
        - from
        - to
        - value
        - previousValue
        - currency
      properties:
        metric:
          $ref: "#/components/schemas/KpiMetric"
        period:
          $ref: "#/components/schemas/Period"
        from:
          type: string
          format: date
          description: First day of the current window, inclusive (UTC)
        to:
          type: string
          format: date
          description: Last day of the current window, inclusive (UTC)
        value:
          type: number
          description: Revenue in the current window, scale 2
        previousValue:
          type: number
          description: Revenue in the previous window, scale 2
        changePercent:
          type: [number, "null"]
          description: (value - previousValue) / previousValue * 100, scale 2. Null when previousValue is 0.
        currency:
          type: string
          description: ISO 4217 currency code of the merchant
    CountKpi:
      type: object
      required:
        - metric
        - period
        - from
        - to
        - value
        - previousValue
      properties:
        metric:
          $ref: "#/components/schemas/KpiMetric"
        period:
          $ref: "#/components/schemas/Period"
        from:
          type: string
          format: date
          description: First day of the current window, inclusive (UTC)
        to:
          type: string
          format: date
          description: Last day of the current window, inclusive (UTC)
        value:
          type: integer
          format: int64
        previousValue:
          type: integer
          format: int64
        changePercent:
          type: [number, "null"]
          description: (value - previousValue) / previousValue * 100, scale 2. Null when previousValue is 0.
    RevenueTrendPoint:
      type: object
      required:
        - date
        - value
      properties:
        date:
          type: string
          format: date
          description: UTC day
        value:
          type: number
          description: Revenue on that day, scale 2. Zero when the day has no counted sales.
    RevenueTrend:
      type: object
      required:
        - period
        - total
        - currency
        - current
        - previous
      properties:
        period:
          $ref: "#/components/schemas/Period"
        total:
          type: number
          description: Sum of current, scale 2
        changePercent:
          type: [number, "null"]
          description: (total - previous total) / previous total * 100, scale 2. Null when the previous total is 0.
        currency:
          type: string
          description: ISO 4217 currency code of the merchant
        current:
          type: array
          description: One point per day of the requested window, ordered by date, zero-filled
          items:
            $ref: "#/components/schemas/RevenueTrendPoint"
        previous:
          type: array
          description: One point per day of the comparison window, ordered by date, zero-filled
          items:
            $ref: "#/components/schemas/RevenueTrendPoint"
    Merchant:
      type: object
      required:
        - id
        - name
        - currency
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        currency:
          type: string
          description: ISO 4217 currency code
    TokenRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
          description: Seconds until the token expires
